

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: procureguard-backend
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=procureguard
      - WEAVIATE_URL=http://weaviate:8080
      - KAFKA_BROKER=kafka:9092
      - OLLAMA_URL=https://ollama.com
      - OLLAMA_MODEL=gemma4:31b
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
    depends_on:
      - neo4j
      - weaviate
      - kafka
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: procureguard-frontend
    environment:
      - VITE_API_BASE_URL=/api
      - VITE_PROXY_TARGET=http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

  neo4j:
    image: neo4j:5.18.0
    container_name: procureguard-neo4j
    ports:
      - "7475:7474" # HTTP UI
      - "7688:7687" # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/procureguard
      - NEO4J_PLUGINS=["apoc"]  # Automatically install APOC plugin on startup
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
    volumes:
      - neo4j_data:/data
      - neo4j_plugins:/plugins
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.24.4
    container_name: procureguard-weaviate
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      - QUERY_DEFAULTS_LIMIT=25
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - DEFAULT_VECTORIZER_MODULE=none
      - ENABLE_MODULES=
      - CLUSTER_HOSTNAME=node1
    volumes:
      - weaviate_data:/var/lib/weaviate
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.7.0
    container_name: procureguard-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
    volumes:
      - kafka_data:/bitnami/kafka
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_plugins:
  weaviate_data:
  kafka_data:
